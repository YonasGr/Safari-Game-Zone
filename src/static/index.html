<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ethio Bingo</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="/socket.io/socket.io.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app">
        <header>
            <h1>Ethio Bingo</h1>
            <div id="user-info"></div>
        </header>

        <main>
            <div id="lobby" class="screen">
                <button id="create-room-btn">Create New Game</button>
                <div id="join-section">
                    <input type="text" id="room-id-input" placeholder="Room ID">
                    <button id="join-room-btn">Join Game</button>
                </div>
            </div>

            <div id="waiting-room" class="screen" style="display: none;">
                <h2>Room: <span id="display-room-id"></span></h2>
                <div id="players-list"></div>
                <button id="start-game-btn" style="display: none;">Start Game</button>
                <p id="waiting-msg">Waiting for host to start...</p>
            </div>

            <div id="game-screen" class="screen" style="display: none;">
                <div id="draw-panel">
                    <h3>Drawn Numbers</h3>
                    <div id="drawn-numbers"></div>
                    <button id="draw-btn" style="display: none;">Draw Next Number</button>
                </div>
                <div id="bingo-card-container"></div>
                <button id="bingo-btn">BINGO!</button>
            </div>
        </main>
    </div>
    <script src="app.js"></script>
</body>
</html>
